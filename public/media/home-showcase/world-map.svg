    <!-- Europe -->
    <path d="M470 80 Q510 65 545 85 Q555 110 535 130 Q505 140 480 125 Q460 105 470 80 Z" />
    <!-- Africa -->
    <path d="M470 175 Q525 160 555 195 Q575 250 555 310 Q540 370 505 375 Q470 370 465 320 Q450 250 470 175 Z" />
    <!-- Asia -->
    <path d="M565 70 Q650 55 730 75 Q820 90 855 130 Q870 170 830 195 Q760 215 690 195 Q610 190 575 150 Q555 110 565 70 Z" />
    <!-- Australia -->
    <path d="M800 330 Q850 320 885 345 Q900 375 870 395 Q835 405 805 385 Q790 355 800 330 Z" />
